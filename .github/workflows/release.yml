name: Package and release Forever Moments

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - Core.lua
      - Options.lua
      - ForeverMoments.toc
      - README.md
      - LICENSE
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forever-moments-release
  cancel-in-progress: false

jobs:
  package-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build and validate installable add-on ZIP
        id: package
        shell: bash
        run: |
          set -euo pipefail

          version="$(sed -n 's/^## Version:[[:space:]]*//p' ForeverMoments.toc | head -n 1 | tr -d '\r')"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid or missing ## Version in ForeverMoments.toc: $version" >&2
            exit 1
          fi
          lua_version="$(sed -n 's/^addon\.version = "\([^"]*\)"/\1/p' Core.lua | head -n 1)"
          if [[ "$lua_version" != "$version" ]]; then
            echo "Core.lua version $lua_version does not match .toc version $version" >&2
            exit 1
          fi

          tag="v${version}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "$tag" ]]; then
            echo "Git tag ${GITHUB_REF_NAME} does not match the .toc version ${tag}" >&2
            exit 1
          fi

          zip_file="ForeverMoments-${tag}.zip"
          mkdir -p staging/ForeverMoments
          cp ForeverMoments.toc Core.lua Options.lua README.md LICENSE staging/ForeverMoments/
          (cd staging && zip -q -r "../${zip_file}" ForeverMoments)

          unzip -t "$zip_file"
          unzip -Z1 "$zip_file" | grep -Fx 'ForeverMoments/ForeverMoments.toc'
          unzip -Z1 "$zip_file" | grep -Fx 'ForeverMoments/Core.lua'
          unzip -Z1 "$zip_file" | grep -Fx 'ForeverMoments/Options.lua'

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "zip_file=$zip_file" >> "$GITHUB_OUTPUT"

      - name: Upload installable ZIP as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ForeverMoments-${{ steps.package.outputs.tag }}
          path: ${{ steps.package.outputs.zip_file }}
          if-no-files-found: error

      - name: Publish GitHub Release with ZIP asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
          ZIP_FILE: ${{ steps.package.outputs.zip_file }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; not replacing its assets."
            echo "Increase the add-on version to publish a new release."
            exit 0
          fi
          gh release create "$RELEASE_TAG" "$ZIP_FILE" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Forever Moments $RELEASE_TAG" \
            --generate-notes
